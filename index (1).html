<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kemalreus</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-image: url('https://i.pinimg.com/originals/74/e9/f9/74e9f9ecd2fab333a6ea926dd18538fd.jpg');
      background-size: cover;
      background-position: center;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      height: 100vh;
    }
    h1 {
      margin-top: -50px;
      font-size: 36px;
      color: #000;
    }
    .box {
      margin-top: 10px;
      width: 400px;
      height: 50px;
      background-color: rgba(255, 192, 203, 0.9);
      border: 2px solid #333;
      border-radius: 10px;
    }
    .button-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 20px;
    }
    .button {
      width: 150px;
      height: 80px;
      margin: 0 10px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.3s, width 0.3s, height 0.3s, font-size 0.3s;
    }
    #yes {
      background-color: green;
      color: white;
    }
    #red {
      background-color: red;
      color: white;
    }
    .button:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="box" id="redBox"></div>
  <h1 id="question">yalcin ifsa icin tikla</h1>
  <div class="button-container">
    <button id="yes" class="button" onclick="yesClicked()">Evet</button>
    <button id="red" class="button" onclick="noClicked()">Hayır</button>
  </div>
</div>

<script>
  var previousWord = "";

  function noClicked() {
    var redButton = document.getElementById('red');

    // Hayır butonunu küçült
    var computedStyleRed = window.getComputedStyle(redButton);
    var currentWidthRed = parseFloat(computedStyleRed.getPropertyValue('width'));
    var currentHeightRed = parseFloat(computedStyleRed.getPropertyValue('height'));
    redButton.style.width = (currentWidthRed * 0.9) + 'px';
    redButton.style.height = (currentHeightRed * 0.9) + 'px';

    // Evet butonunu büyüt
    var yesButton = document.getElementById('yes');
    var computedStyleYes = window.getComputedStyle(yesButton);
    var currentWidthYes = parseFloat(computedStyleYes.getPropertyValue('width'));
    var currentHeightYes = parseFloat(computedStyleYes.getPropertyValue('height'));
    var currentFontSizeYes = parseFloat(computedStyleYes.getPropertyValue('font-size'));
    yesButton.style.width = (currentWidthYes * 1.1) + 'px';
    yesButton.style.height = (currentHeightYes * 1.1) + 'px';
    yesButton.style.fontSize = (currentFontSizeYes * 1.1) + 'px';

    // Buton metnini rastgele değiştir
    changeRedText();
  }

  function changeRedText() {
    var words = ["emin misin", "bi daha düşün", "?????", "bro", "cidden mi?"];
    var filteredWords = words.filter(word => word !== previousWord);
    var randomIndex = Math.floor(Math.random() * filteredWords.length);
    var redButton = document.getElementById('red');
    var selectedWord = filteredWords[randomIndex];
    redButton.innerHTML = selectedWord;
    previousWord = selectedWord;
  }

  function yesClicked() {
    // YouTube videosunu yeni sekmede aç
    window.open('https://www.youtube.com/watch?v=6RA-kHVCSBA', '_blank');
  }
</script>

</body>
</html>
